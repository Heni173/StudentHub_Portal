    <meta charset="UTF-8">

<body style="text-align: center;">

    <header>
        <img src="logo.jpeg" alt="Student Hub Logo" width="250">
        <h1>STUDENT HUB</h1>

        <nav>

    <main>
        <section>
            <h2>Share your valuable Feedback</h2>

            <form>
                <label for="name"><b>Name</b></label><br>
                <input type="text" id="name" placeholder="Enter Your Name"><br><br>

                <label for="email"><b>Email</b></label><br>
                <input type="email" id="email" placeholder="Enter Your Email"><br><br>

                <label for="feedback"><b>Feedback</b></label><br>
                <textarea id="feedback" rows="3" cols="30" placeholder="Write your feedback"></textarea><br><br>

                <input type="submit" value="Submit">
                <input type="reset" value="Clear">
            </form>
        </section>

        <hr>

        <section>
            <p><b>Thank You!</b><br>
            Your feedback helps us improve Student Hub.</p>
        </section>
    </main>

    <hr>

    <footer>
