<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Hub - Location</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background-image:linear-gradient(rgba(248,250,252,0.85),rgba(234,244,248,0.85)),url("background.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:#2E2E2E;
    transition:0.3s;
}


/* NOTIFICATION */

#notification{
    background:#005F73;
    color:white;
    padding:12px;
    text-align:center;
    font-weight:bold;
}

#closeNotification{
    margin-left:15px;
    border:none;
    padding:5px 10px;
    border-radius:15px;
    cursor:pointer;
    transition:0.3s;
}

#closeNotification:hover{
    transform:scale(1.1);
}


/* THEME BUTTON */

#themeButton{
    position:absolute;
    top:18px;
    right:25px;
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:white;
    color:#002147;
    font-size:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    transition:0.3s;
}

#themeButton:hover{
    transform:scale(1.1);
}


/* HAMBURGER MENU */

#menuButton{
    display:none;
    background:white;
    color:#002147;
    border:none;
    padding:10px 20px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

#menuButton:hover{
    transform:scale(1.05);
}


/* HEADER */

header{
    background:linear-gradient(135deg,#002147,#4dc8e0);
    color:white;
    text-align:center;
    padding:30px 20px;
    box-shadow:0 8px 20px rgba(0,0,0,.18);
}

header img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:50%;
    border:5px solid rgb(14,1,1);
    padding:5px;
    background:white;
}

header h1{
    margin:15px 0;
    font-size:36px;
}

header h2{
    font-size:28px;
}


/* NAVIGATION */

nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:20px;
}

nav a{
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,.15);
    padding:10px 18px;
    border-radius:25px;
    font-weight:600;
    transition:.3s;
}

nav a:hover{
    background:white;
    color:#002147;
}


/* MAIN */

main{
    width:90%;
    margin:auto;
    padding:45px 0;
}

.location-box{
    background:rgba(255,255,255,0.88);
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
    width:1100px;
    max-width:95%;
    margin:auto;
    padding:40px;
    border-radius:18px;
    box-shadow:0 8px 20px rgba(0,0,0,.18);
    text-align:center;
    transition:.3s;
    cursor:pointer;
}

.location-box:hover{
    background:rgba(234,244,248,0.95);
    transform:translateY(-8px);
    box-shadow:0 12px 25px rgba(0,0,0,.25);
}

.location-box h2{
    font-size:34px;
    color:#002147;
    margin-bottom:15px;
}

.location-box p{
    font-size:20px;
    margin-bottom:25px;
}

.location-box iframe{
    width:100%;
    height:420px;
    border:0;
    border-radius:15px;
    box-shadow:0 6px 15px rgba(0,0,0,.15);
}


/* FOOTER */

footer{
    background:linear-gradient(135deg,#002147,#4dc8e0);
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

footer p{
    margin:5px 0;
}


/* DARK MODE */

body.dark{
    background:#121212;
    color:white;
}

body.dark header{
    background:linear-gradient(135deg,#002147,#4dc8e0);
}

body.dark footer{
    background:linear-gradient(135deg,#002147,#4dc8e0);
}

body.dark nav a{
    color:white;
    background:rgba(255,255,255,.15);
}

body.dark nav a:hover{
    background:white;
    color:#002147;
}

body.dark .location-box{
    background:#1e1e1e;
    color:white;
}

body.dark .location-box:hover{
    background:#292929;
}

body.dark .location-box h2{
    color:#4dc8e0;
}


/* MOBILE */

@media(max-width:700px){

    #menuButton{
        display:block;
        margin:15px auto;
    }

    #navigation{
        display:none;
        flex-direction:column;
        align-items:center;
    }

    #navigation.show{
        display:flex;
    }

    nav a{
        width:220px;
        text-align:center;
    }

    #themeButton{
        top:15px;
        right:15px;
    }

    header img{
        width:140px;
        height:140px;
    }

    header h1{
        font-size:28px;
    }

    header h2{
        font-size:23px;
    }

    .location-box{
        width:95%;
        padding:20px;
    }

    .location-box h2{
        font-size:28px;
    }

    .location-box p{
        font-size:18px;
    }

    .location-box iframe{
        height:300px;
    }

}

</style>

</head>

<body>

<!-- NOTIFICATION -->

<div id="notification">

    🔔 New updates are available!

    <button id="closeNotification" type="button" aria-label="Close notification">
        ✕
    </button>

</div>


<!-- HEADER -->

<header>

    <button id="themeButton" type="button" title="Change theme" aria-label="Change theme">
        🌙
    </button>

    <img src="logo.jpeg" alt="Student Hub Logo">

    <h1>STUDENT HUB</h1>

    <h2>Location</h2>

    <button id="menuButton" type="button" aria-label="Open navigation menu">
        ☰ Menu
    </button>

    <nav id="navigation">

        <a href="Home.html">Home</a>
        <a href="Register.html">Register</a>
        <a href="Dashboard.html">Dashboard</a>
        <a href="Profile.html">Profile</a>
        <a href="Events.html">Events</a>
        <a href="About.html">About Us</a>
        <a href="ContactUs.html">Contact Us</a>
        <a href="Feedback.html">Feedback</a>
        <a href="Location.html">Location</a>

    </nav>

</header>


<!-- MAIN -->

<main>

    <section class="location-box">

        <h2>Our Location</h2>

        <p>
            Find us easily using the map below.
        </p>

        <iframe
            src="https://maps.google.com/maps?q=CHARUSAT%20University&t=&z=15&output=embed">
        </iframe>

    </section>

</main>


<!-- FOOTER -->

<footer>

    <p><b>Student Hub</b></p>
    <p>Learn • Explore • Grow</p>
    <p>&copy; 2026 Student Hub. All Rights Reserved.</p>
    <p>Designed & Developed by Heni Patel</p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="Location.js"></script>

</body>
</html>
